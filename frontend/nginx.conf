# Dashboard + reverse proxy (Docker Compose). The API container is "api".

# WebSocket upgrade for Socket.IO.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Keep the caller's X-Request-Id, otherwise use nginx's, so access logs here
# and the API's logs share the correlation ID.
map $http_x_request_id $correlation_id {
  default $http_x_request_id;
  ''      $request_id;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $correlation_id;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/queues/..., /jobs/...) all serve the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
